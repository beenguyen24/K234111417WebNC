<table border="1">
    <thead>
        <tr>
            <th>Product ID</th>
            <th>Product Name</th>
            <th>Price</th>
            <th>Image</th>
        </tr>
    </thead>
    <tbody>
        <tr *ngFor="let p of products" [ngClass]="{'highlight': p.id == selected_id, 'negative-price': p.price < 0}">
            <td>{{p.id}}</td>
            <td>{{p.name}}</td>
            <td>{{p.price | currency:'VND'}}</td>
            <td>
                <img [src]="p.image" height="100" width="100" 
                title="click for viewing detail"
                style="cursor: pointer;"
                (click)="view_detail(p.id)"/>
            </td>
        </tr>
    </tbody>    
</table>
