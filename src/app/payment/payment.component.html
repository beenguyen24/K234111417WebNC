<div class="payment-page">
    <div class="bg-glow glow-1"></div>
    <div class="bg-glow glow-2"></div>

    <section class="payment-card">
        <aside class="brand-panel">
            <p class="brand-tag">Ví điện tử MoMo</p>
            <h1>Thanh Toán Nhanh</h1>
            <p class="brand-text">
                Hoàn tất đơn hàng trong vài giây với giao diện mới, an toàn và thân thiện trên mọi thiết bị.
            </p>
            <div class="brand-points">
                <p>Thanh toán 24/7</p>
                <p>Bảo mật nhiều lớp</p>
                <p>Hỗ trợ hoàn tiền nhanh</p>
            </div>
        </aside>

        <div class="form-panel">
            <form *ngIf="!loading" (ngSubmit)="payWithMoMo()">
                <div *ngIf="errorMsg" class="alert alert-danger">
                    {{ errorMsg }}
                </div>

                <div *ngIf="successMsg" class="alert alert-success">
                    {{ successMsg }}
                </div>

                <div class="form-group">
                    <label for="fullName">Họ và Tên</label>
                    <input
                        type="text"
                        id="fullName"
                        [(ngModel)]="fullName"
                        name="fullName"
                        class="form-control"
                        placeholder="Nhập họ và tên"
                        required>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input
                        type="email"
                        id="email"
                        [(ngModel)]="email"
                        name="email"
                        class="form-control"
                        placeholder="Nhập địa chỉ email"
                        required>
                </div>

                <div class="form-group">
                    <label for="phone">Số điện thoại</label>
                    <input
                        type="tel"
                        id="phone"
                        [(ngModel)]="phone"
                        name="phone"
                        class="form-control"
                        placeholder="Nhập số điện thoại"
                        required>
                </div>

                <div class="form-group">
                    <label for="amount">Số tiền (VND)</label>
                    <input
                        type="number"
                        id="amount"
                        [(ngModel)]="amount"
                        name="amount"
                        class="form-control"
                        placeholder="Nhập số tiền cần thanh toán"
                        min="10000"
                        required>
                    <small>Tối thiểu: 10,000 VND</small>
                </div>

                <div class="button-group">
                    <button
                        type="submit"
                        class="btn btn-momo"
                        [disabled]="loading">
                        <span *ngIf="!loading">Thanh Toán với MoMo</span>
                        <span *ngIf="loading">Đang xử lý...</span>
                    </button>
                    <button
                        type="button"
                        class="btn btn-reset"
                        (click)="resetForm()"
                        [disabled]="loading">
                        Xóa
                    </button>
                </div>
            </form>

            <div *ngIf="loading" class="loading">
                <div class="spinner"></div>
                <p>Đang kết nối đến cổng thanh toán MoMo...</p>
            </div>
        </div>
    </section>
</div>
