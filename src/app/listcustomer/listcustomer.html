<h2>Danh sach khach hang</h2>
<table class="customer-table">
  <thead>
    <tr>
      <th>Ma KH</th>
      <th>Ten KH</th>
      <th>Tuoi</th>
      <th>Thanh pho</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let c of customers">
      <td>{{ c.id }}</td>
      <td>{{ c.name }}</td>
      <td>{{ c.age }}</td>
      <td>{{ c.city }}</td>
    </tr>
  </tbody>
</table>
